<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách - Quản lý sách V4.1</title>
<link id="themeStylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
<img src="assets/img/logo.png" class="nav-logo me-2" onerror="this.outerHTML='<i class=\'bi bi-book-half me-2\'></i>'">
Book Tracker
</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i>Trang chủ</a></li>
<li class="nav-item"><a class="nav-link active" href="books.html"><i class="bi bi-journal-bookmark me-1"></i>Danh sách</a></li>
<li class="nav-item"><a class="nav-link" href="settings.html"><i class="bi bi-gear me-1"></i>Cài đặt</a></li>
</ul>
<button class="btn btn-outline-light btn-sm ms-2" id="btnExportJSON"><i class="bi bi-download me-1"></i>Sao lưu</button>
<label class="btn btn-outline-light btn-sm ms-2 mb-0" for="btnImportJSON"><i class="bi bi-upload me-1"></i>Khôi phục</label>
<input type="file" id="btnImportJSON" accept=".json" style="display: none;">
</div>
</div>
</nav>

<div class="container py-5">
<div class="card shadow-sm border-0 rounded-4 mb-5 bg-body-tertiary">
<div class="card-body p-4">
<h5 class="fw-bold mb-4">
<img src="assets/img/icon-add.png" class="title-icon me-2" onerror="this.outerHTML='<i class=\'bi bi-plus-circle text-primary me-2\'></i>'">Thêm / Cập nhật sách
</h5>
<form id="bookForm">
<div class="row g-3">
<input type="hidden" id="bookId">
<div class="col-md-3">
<label class="form-label small text-muted">Tên sách</label>
<input type="text" class="form-control" id="title" required>
</div>
<div class="col-md-3">
<label class="form-label small text-muted">Tác giả</label>
<input type="text" class="form-control" id="author" required>
</div>
<div class="col-md-3">
<label class="form-label small text-muted">URL Ảnh bìa</label>
<input type="url" class="form-control" id="coverUrl" placeholder="https://...">
</div>
<div class="col-md-2">
<label class="form-label small text-muted">Trạng thái</label>
<select class="form-select" id="status">
<option value="Chưa đọc">Chưa đọc</option>
<option value="Đang đọc">Đang đọc</option>
<option value="Đã đọc">Đã đọc</option>
</select>
</div>
<div class="col-md-1 d-flex align-items-end">
<button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i></button>
</div>
</div>
</form>
</div>
</div>
<h4 class="fw-bold mb-4">
<img src="assets/img/icon-library.png" class="title-icon me-2" onerror="this.outerHTML='<i class=\'bi bi-bookshelf me-2\'></i>'">Thư viện của bạn
</h4>
<div class="row g-4" id="bookGrid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/books.js"></script>
</body>
</html>
