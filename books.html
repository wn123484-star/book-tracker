<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách - Quản lý sách</title>
<link id="themeStylesheet" href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<script>
    (function() {
        const themeUrls = {
            'default': 'vendor/bootstrap/bootstrap.min.css',
            'flatly': 'vendor/bootswatch/flatly.min.css',
            'cyborg': 'vendor/bootswatch/cyborg.min.css',
            'sketchy': 'vendor/bootswatch/sketchy.min.css',
            'morph': 'vendor/bootswatch/morph.min.css'
        };
        const savedTheme = localStorage.getItem('app_theme') || 'default';
        document.getElementById('themeStylesheet').href = themeUrls[savedTheme] || themeUrls['default'];
        
        if ((localStorage.getItem('app_icon_pack') || 'bo1') === 'bo4') {
            document.documentElement.classList.add('use-default-icons');
        }
        
        const bg = localStorage.getItem('app_bg');
        if (bg) {
            document.documentElement.classList.add('has-bg');
            document.write(`<style>body.has-bg { background-image: url(${bg}); background-size: cover; background-position: center; background-attachment: fixed; }</style>`);
        }
    })();
</script>
<link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
<i class="bi bi-book-half me-2 default-icon"></i>
<img data-icon="logo.png" class="nav-logo me-2 dynamic-icon" alt="">
Book Tracker
</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i>Trang chủ</a></li>
<li class="nav-item"><a class="nav-link active" href="books.html"><i class="bi bi-journal-bookmark me-1"></i>Danh sách</a></li>
<li class="nav-item"><a class="nav-link" href="settings.html"><i class="bi bi-gear me-1"></i>Cài đặt</a></li>
</ul>
<button class="btn btn-outline-light btn-sm ms-2" id="btnExportJSON"><i class="bi bi-download me-1"></i>Sao lưu</button>
<label class="btn btn-outline-light btn-sm ms-2 mb-0" for="btnImportJSON"><i class="bi bi-upload me-1"></i>Khôi phục</label>
<input type="file" id="btnImportJSON" accept=".json" style="display: none;">
</div>
</div>
</nav>

<div class="container py-5">
<div class="card shadow-sm border-0 rounded-4 mb-5 bg-body-tertiary">
<div class="card-body p-4">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
<h5 class="fw-bold mb-0">
<i class="bi bi-plus-circle text-primary me-2 default-icon"></i>
<img data-icon="icon-add.png" class="title-icon me-2 dynamic-icon" alt="">Thêm / Cập nhật sách
</h5>
<div>
<label class="btn btn-sm btn-outline-primary mb-0" for="btnBatchImport">
<i class="bi bi-file-earmark-arrow-up me-1"></i>Nhập JSON (Cộng dồn)
</label>
<input type="file" id="btnBatchImport" accept=".json" style="display: none;">
</div>
</div>
<form id="bookForm">
<div class="row g-3">
<input type="hidden" id="bookId">
<div class="col-md-3">
<label class="form-label small text-muted">Tên sách</label>
<input type="text" class="form-control" id="title" required>
</div>
<div class="col-md-3">
<label class="form-label small text-muted">Tác giả</label>
<input type="text" class="form-control" id="author" required>
</div>
<div class="col-md-3">
<label class="form-label small text-muted">URL Ảnh bìa</label>
<input type="url" class="form-control" id="coverUrl" placeholder="https://...">
</div>
<div class="col-md-2">
<label class="form-label small text-muted">Trạng thái</label>
<select class="form-select" id="status">
<option value="Chưa đọc">Chưa đọc</option>
<option value="Đang đọc">Đang đọc</option>
<option value="Đã đọc">Đã đọc</option>
</select>
</div>
<div class="col-md-1 d-flex align-items-end">
<button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i></button>
</div>
</div>
</form>
</div>
</div>
<h4 class="fw-bold mb-4">
<i class="bi bi-bookshelf me-2 default-icon"></i>
<img data-icon="icon-library.png" class="title-icon me-2 dynamic-icon" alt="">Thư viện của bạn
</h4>
<div class="row g-4" id="bookGrid"></div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/books.js"></script>
</body>
</html>
