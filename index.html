<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang chủ - Quản lý sách</title>
<link id="themeStylesheet" href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<script>
    (function() {
        const themeUrls = {
            'default': 'vendor/bootstrap/bootstrap.min.css',
            'flatly': 'vendor/bootswatch/flatly.min.css',
            'cyborg': 'vendor/bootswatch/cyborg.min.css',
            'sketchy': 'vendor/bootswatch/sketchy.min.css',
            'morph': 'vendor/bootswatch/morph.min.css'
        };
        const savedTheme = localStorage.getItem('app_theme') || 'default';
        document.getElementById('themeStylesheet').href = themeUrls[savedTheme] || themeUrls['default'];
        
        if ((localStorage.getItem('app_icon_pack') || 'bo1') === 'bo4') {
            document.documentElement.classList.add('use-default-icons');
        }
        
        const bg = localStorage.getItem('app_bg');
        if (bg) {
            document.documentElement.classList.add('has-bg');
            document.write(`<style>body.has-bg { background-image: url(${bg}); background-size: cover; background-position: center; background-attachment: fixed; }</style>`);
        }
    })();
</script>
<link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="vendor/chartjs/chart.umd.js"></script>
<script src="vendor/emailjs/email.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
<i class="bi bi-book-half me-2 default-icon"></i>
<img data-icon="logo.png" class="nav-logo me-2 dynamic-icon" alt="">
Book Tracker
</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link active" href="index.html"><i class="bi bi-house-door me-1"></i>Trang chủ</a></li>
<li class="nav-item"><a class="nav-link" href="books.html"><i class="bi bi-journal-bookmark me-1"></i>Danh sách</a></li>
<li class="nav-item"><a class="nav-link" href="settings.html"><i class="bi bi-gear me-1"></i>Cài đặt</a></li>
</ul>
<button class="btn btn-outline-light btn-sm ms-2" id="btnExportJSON"><i class="bi bi-download me-1"></i>Sao lưu</button>
<label class="btn btn-outline-light btn-sm ms-2 mb-0" for="btnImportJSON"><i class="bi bi-upload me-1"></i>Khôi phục</label>
<input type="file" id="btnImportJSON" accept=".json" style="display: none;">
</div>
</div>
</nav>

<div class="container py-5">
<div class="row g-4 mb-5">
<div class="col-md-4">
<div class="card stat-card shadow-sm h-100 bg-primary bg-opacity-10 border-0">
<div class="card-body d-flex align-items-center">
<div class="icon-box bg-primary text-white me-3">
<i class="bi bi-collection default-icon"></i>
<img data-icon="icon-total.png" class="stat-icon dynamic-icon" alt="">
</div>
<div>
<h6 class="card-title text-muted mb-1">Tổng số sách</h6>
<h2 class="mb-0 fw-bold text-primary" id="totalBooks">0</h2>
</div>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card stat-card shadow-sm h-100 bg-success bg-opacity-10 border-0">
<div class="card-body d-flex align-items-center">
<div class="icon-box bg-success text-white me-3">
<i class="bi bi-check-circle default-icon"></i>
<img data-icon="icon-read.png" class="stat-icon dynamic-icon" alt="">
</div>
<div>
<h6 class="card-title text-muted mb-1">Đã đọc</h6>
<h2 class="mb-0 fw-bold text-success" id="readBooks">0</h2>
</div>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card stat-card shadow-sm h-100 bg-warning bg-opacity-10 border-0">
<div class="card-body d-flex align-items-center">
<div class="icon-box bg-warning text-dark me-3">
<i class="bi bi-bookmark-dash default-icon"></i>
<img data-icon="icon-unread.png" class="stat-icon dynamic-icon" alt="">
</div>
<div>
<h6 class="card-title text-muted mb-1">Chưa / Đang đọc</h6>
<h2 class="mb-0 fw-bold text-warning" id="unreadBooks">0</h2>
</div>
</div>
</div>
</div>
</div>

<div class="row justify-content-center">
<div class="col-md-6 mb-4">
<div class="card shadow-sm border-0 rounded-4 h-100 bg-body">
<div class="card-body p-4 text-center">
<h5 class="fw-bold mb-4">
<i class="bi bi-pie-chart me-2 default-icon"></i>
<img data-icon="icon-chart.png" class="title-icon me-2 dynamic-icon" alt="">Thống kê trạng thái
</h5>
<div id="chartContainer" class="d-flex justify-content-center align-items-center" style="min-height: 250px;">
<canvas id="bookChart"></canvas>
</div>
</div>
</div>
</div>
<div class="col-md-6 mb-4">
<div class="card shadow-sm border-0 rounded-4 h-100 bg-body">
<div class="card-body p-4 text-center d-flex flex-column justify-content-center">
<i class="bi bi-envelope-paper display-3 text-primary mb-3 default-icon d-block mx-auto"></i>
<img data-icon="icon-email.png" class="giant-icon mb-3 mx-auto dynamic-icon" alt="">
<h5 class="fw-bold mb-3">Báo cáo Email</h5>
<p class="text-muted small mb-4">Gửi báo cáo thống kê tiến độ đọc sách hiện tại về địa chỉ email cá nhân của bạn.</p>
<button class="btn btn-primary" id="btnSendReport"><i class="bi bi-send me-2"></i>Gửi báo cáo ngay</button>
</div>
</div>
</div>
</div>
</div>

<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/sweetalert2/sweetalert2.all.min.js"></script>
<script src="assets/js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const books = getBooks();
        let readCount = 0, unreadCount = 0;
        books.forEach(b => b.status === 'Đã đọc' ? readCount++ : unreadCount++);
        
        document.getElementById('totalBooks').innerText = books.length;
        document.getElementById('readBooks').innerText = readCount;
        document.getElementById('unreadBooks').innerText = unreadCount;
        
        const chartContainer = document.getElementById('chartContainer');
        const ctx = document.getElementById('bookChart');
        
        if(books.length === 0) {
            chartContainer.innerHTML = `
                <div class="empty-state">
                    <i class="bi bi-inbox fs-1 d-block mb-3 default-icon"></i>
                    <img data-icon="icon-empty.png" class="empty-icon mb-3 dynamic-icon" alt="">
                    <p class="mb-0">Chưa có dữ liệu sách.<br><a href="books.html" class="text-decoration-none">Thêm sách ngay</a></p>
                </div>`;
            applyIconPack();
        } else {
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Đã đọc', 'Chưa / Đang đọc'],
                    datasets: [{
                        data: [readCount, unreadCount],
                        backgroundColor: ['#198754', '#ffc107'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '70%', plugins: { legend: { position: 'bottom' } } }
            });
        }

        document.getElementById('btnSendReport').addEventListener('click', function() {
            if(books.length === 0) {
                Swal.fire('Lỗi', 'Không có dữ liệu để gửi báo cáo', 'error');
                return;
            }
            const emailConfig = JSON.parse(localStorage.getItem('emailConfig') || '{}');
            if(!emailConfig.publicKey || !emailConfig.serviceId || !emailConfig.templateId || !emailConfig.targetEmail) {
                Swal.fire({
                    title: 'Chưa cấu hình Email',
                    text: 'Vui lòng vào trang Cài đặt để điền thông tin EmailJS.',
                    icon: 'warning',
                    confirmButtonText: 'Đến Cài đặt'
                }).then((result) => {
                    if (result.isConfirmed) window.location.href = 'settings.html';
                });
                return;
            }
            Swal.fire({ title: 'Đang gửi...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            emailjs.init(emailConfig.publicKey);
            const templateParams = {
                to_email: emailConfig.targetEmail,
                total_books: books.length,
                read_books: readCount,
                unread_books: unreadCount,
                time: new Date().toLocaleString('vi-VN')
            };
            emailjs.send(emailConfig.serviceId, emailConfig.templateId, templateParams)
                .then(() => {
                    Swal.fire('Thành công', `Báo cáo đã gửi tới: ${emailConfig.targetEmail}`, 'success');
                }, (error) => {
                    Swal.fire('Lỗi', 'Gửi thất bại. Kiểm tra lại Key hoặc ID.', 'error');
                });
        });
    });
</script>
</body>
</html>
