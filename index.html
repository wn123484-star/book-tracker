<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang chủ - Quản lý sách</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body { background-color: var(--bs-tertiary-bg); }
.stat-card { transition: transform 0.2s; border: none; border-radius: 15px; }
.stat-card:hover { transform: translateY(-5px); }
.icon-box { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.empty-state { padding: 40px 20px; text-align: center; color: var(--bs-secondary-color); }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-book-half text-primary me-2"></i>Quản lý sách</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav me-auto">
<li class="nav-item"><a class="nav-link active" href="index.html"><i class="bi bi-house-door me-1"></i>Trang chủ</a></li>
<li class="nav-item"><a class="nav-link" href="books.html"><i class="bi bi-journal-bookmark me-1"></i>Danh sách</a></li>
<li class="nav-item"><a class="nav-link" href="about.html"><i class="bi bi-info-circle me-1"></i>Thông tin</a></li>
</ul>
<button class="btn btn-outline-light border-0" id="darkModeBtn"><i class="bi bi-moon-stars"></i></button>
</div>
</div>
</nav>

<div class="container py-5">
<div class="row g-4 mb-5">
<div class="col-md-4">
<div class="card stat-card shadow-sm h-100 bg-primary bg-opacity-10">
<div class="card-body d-flex align-items-center">
<div class="icon-box bg-primary text-white me-3"><i class="bi bi-collection"></i></div>
<div>
<h6 class="card-title text-muted mb-1">Tổng số sách</h6>
<h2 class="mb-0 fw-bold text-primary" id="totalBooks">0</h2>
</div>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card stat-card shadow-sm h-100 bg-success bg-opacity-10">
<div class="card-body d-flex align-items-center">
<div class="icon-box bg-success text-white me-3"><i class="bi bi-check-circle"></i></div>
<div>
<h6 class="card-title text-muted mb-1">Đã đọc</h6>
<h2 class="mb-0 fw-bold text-success" id="readBooks">0</h2>
</div>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card stat-card shadow-sm h-100 bg-warning bg-opacity-10">
<div class="card-body d-flex align-items-center">
<div class="icon-box bg-warning text-dark me-3"><i class="bi bi-bookmark-dash"></i></div>
<div>
<h6 class="card-title text-muted mb-1">Chưa / Đang đọc</h6>
<h2 class="mb-0 fw-bold text-warning" id="unreadBooks">0</h2>
</div>
</div>
</div>
</div>
</div>

<div class="row justify-content-center">
<div class="col-md-6">
<div class="card shadow-sm border-0 rounded-4">
<div class="card-body p-4">
<h5 class="fw-bold mb-4 text-center"><i class="bi bi-pie-chart me-2"></i>Thống kê trạng thái</h5>
<div id="chartContainer" class="d-flex justify-content-center align-items-center" style="min-height: 300px;">
<canvas id="bookChart"></canvas>
</div>
</div>
</div>
</div>
</div>
</div>

<script>
const theme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-bs-theme', theme);

const btn = document.getElementById('darkModeBtn');
btn.innerHTML = theme === 'light' ? '<i class="bi bi-moon-stars"></i>' : '<i class="bi bi-sun"></i>';

btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-bs-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', next);
    localStorage.setItem('theme', next);
    btn.innerHTML = next === 'light' ? '<i class="bi bi-moon-stars"></i>' : '<i class="bi bi-sun"></i>';
});

const books = JSON.parse(localStorage.getItem('books') || '[]');
let readCount = 0;
let unreadCount = 0;

books.forEach(b => {
    if(b.status === 'Đã đọc') readCount++;
    else unreadCount++;
});

document.getElementById('totalBooks').innerText = books.length;
document.getElementById('readBooks').innerText = readCount;
document.getElementById('unreadBooks').innerText = unreadCount;

const chartContainer = document.getElementById('chartContainer');
const ctx = document.getElementById('bookChart');

if(books.length === 0) {
    chartContainer.innerHTML = '<div class="empty-state"><i class="bi bi-inbox fs-1 d-block mb-3"></i><p class="mb-0">Chưa có dữ liệu sách.<br><a href="books.html" class="text-decoration-none">Thêm sách ngay</a></p></div>';
} else {
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Đã đọc', 'Chưa / Đang đọc'],
            datasets: [{
                data: [readCount, unreadCount],
                backgroundColor: ['#198754', '#ffc107'],
                borderWidth: 0
            }]
        },
        options: {
            cutout: '70%',
            plugins: { legend: { position: 'bottom' } }
        }
    });
}
</script>
</body>
</html>
